# Publishes every wrapper's image to ghcr.io/mendelbuild/<slug>:<version>.
#
# A wrapper is a directory with a wrapper.json and a Dockerfile. Its image is
# public, so any project's cluster can pull it, and Mendel registers it by
# the digest this prints (mendel-tool tools register -image
# ghcr.io/mendelbuild/<slug>@sha256:...). A version's tag is built once and
# never rebuilt: Mendel pins one digest per version, so a changed wrapper is
# a new version in its wrapper.json.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The wrapper protocol is vendored, since Mendel's module is private.
      - run: go vet -mod=vendor ./... && go test -mod=vendor ./...

  find:
    runs-on: ubuntu-latest
    outputs:
      wrappers: ${{ steps.list.outputs.wrappers }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "wrappers=$(find . -mindepth 2 -maxdepth 2 -name wrapper.json -exec dirname {} \; \
            | sed 's#^\./##' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, find]
    if: ${{ needs.find.outputs.wrappers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wrapper: ${{ fromJSON(needs.find.outputs.wrappers) }}
    steps:
      - uses: actions/checkout@v4
      - id: describe
        run: |
          echo "slug=$(jq -r .tool.slug '${{ matrix.wrapper }}/wrapper.json')" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version '${{ matrix.wrapper }}/wrapper.json')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        name: Is this version already published?
        # Authenticated, so a version already pushed to a package that is
        # still private is found and never rebuilt. The digest is the sha256
        # of the manifest's raw bytes: `--format` is ignored by some buildx
        # versions, and the raw manifest is what the digest names anyway.
        run: |
          IMAGE="ghcr.io/mendelbuild/${{ steps.describe.outputs.slug }}:${{ steps.describe.outputs.version }}"
          if RAW=$(docker buildx imagetools inspect --raw "$IMAGE" 2>/dev/null); then
            DIGEST="sha256:$(printf '%s' "$RAW" | sha256sum | cut -d' ' -f1)"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.published == 'false'
      - id: build
        uses: docker/build-push-action@v6
        if: steps.existing.outputs.published == 'false'
        with:
          context: .
          file: ${{ matrix.wrapper }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mendelbuild/${{ steps.describe.outputs.slug }}:${{ steps.describe.outputs.version }}
            ghcr.io/mendelbuild/${{ steps.describe.outputs.slug }}:sha-${{ github.sha }}
      - name: Say what to register
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            DIGEST="${{ steps.existing.outputs.digest }}"
            STATE="was already published; a changed wrapper is a new version"
          else
            STATE="published"
          fi
          {
            echo "### ${{ steps.describe.outputs.slug }} ${{ steps.describe.outputs.version }}: $STATE"
            echo
            echo '```'
            echo "mendel-tool tools register -file ${{ matrix.wrapper }}/wrapper.json \\"
            echo "  -image ghcr.io/mendelbuild/${{ steps.describe.outputs.slug }}@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
