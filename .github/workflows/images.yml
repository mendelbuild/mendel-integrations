# Publishes each changed wrapper's image to the staging wrapper package,
#
#   ghcr.io/mendelbuild/wrappers-staging:<slug>-<version>-<commit>
#
# and promote.yml copies one, by digest, into the production package,
# ghcr.io/mendelbuild/wrappers-prod, under the same tag.
#
# A wrapper Mendel wrote itself (Mendel's doc 35 §20, decision 2) arrives on a
# branch of its own, generated/<env>/<slug>-<version>-<id>, never on main, and
# is built into that environment's candidates package,
#
#   ghcr.io/mendelbuild/wrapper-candidates-<env>:<slug>-<version>-<commit>
#
# which the Mendel installation that pushed it reads the digest from and
# registers as an unreviewed candidate. Nobody here reviews it first: git is
# the record, not a review. Merging it to main is what promotes it, through
# the path above.
#
# Every wrapper shares one package per environment and kind, and the tag says
# which wrapper it is. The set of packages is fixed, one per kind of image a
# project's cluster pulls, per environment: wrappers-staging and
# wrappers-prod, wrapper-candidates-staging and wrapper-candidates-prod here,
# and Mendel's wrapper-shim-staging and wrapper-shim-prod, pushed by its
# gke-deploy.sh. Staging's and production's images are kept apart by package,
# reviewed wrappers are kept apart from candidates, and a new wrapper is a
# tag, never a package (README, "Publishing").
#
# Nothing here checks for a collision, because none can happen:
#
#   - The slug is the wrapper's directory, and a directory must be named for
#     the slug its wrapper.json declares, so two wrappers cannot share one.
#   - The commit is the last part and always twelve hex digits, and the
#     version, just before it, may not contain a '-' (the find job refuses
#     one). Read from the right, a tag splits into slug, version and commit
#     exactly one way, so two wrappers cannot produce the same tag.
#   - A commit is never built twice, so a tag never moves.
#
# Tags are labels for finding a digest; Mendel registers the digest this
# prints (mendel-tool tools register -image ghcr.io/mendelbuild/wrappers-staging@sha256:...),
# and each installation's registry refuses a second digest for a version it
# already holds. So a wrapper rebuilt at a new commit without a new version in
# its wrapper.json publishes fine and is refused at registration, with the
# sentence saying why.
#
# This workflow and promote.yml are the only writers to the wrapper packages,
# and nothing published is ever deleted: an image that looks unused may be
# what an installation runs, and a production digest is exactly a staging one.
name: images

on:
  push:
    branches: [main, 'generated/staging/**', 'generated/prod/**']
  workflow_dispatch:

# Every job asks for the least it needs. Only `push` can write a package, and
# it checks out nothing and runs nothing a wrapper's author wrote: it pushes
# the tarball `build` made. `test` and `build` run a wrapper's own code -- its
# tests, its Dockerfile's RUN steps -- with a token that can only read this
# public repository, which no checkout leaves on disk (persist-credentials:
# false), from a build context without .git. A wrapper Mendel wrote is code
# nobody has reviewed, and this is what keeps it from reaching a package.
#
# A generated branch cannot change this file only because the token Mendel
# pushes with has contents: write and not the Workflows permission, which
# GitHub requires to push a change under .github/workflows. That token must
# stay contents-only (README, "Publishing").
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Nothing is fetched (the contract is beside the wrappers), so
          # there is no go.sum to key a cache on.
          cache: false
      # The contract is a module of its own, which the wrappers build against
      # through a replace, so both are checked.
      - run: go vet ./... && go test ./... && cd contract && go vet ./... && go test ./...

  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      wrappers: ${{ steps.list.outputs.wrappers }}
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every wrapper's directory is named for its slug
        run: |
          status=0
          for f in */wrapper.json; do
            dir=$(dirname "$f")
            slug=$(jq -r .tool.slug "$f")
            if [ "$dir" != "$slug" ]; then
              echo "::error file=$f::$dir/wrapper.json declares slug \"$slug\"; the directory must be named $slug"
              status=1
            fi
          done
          exit $status
      # The tag's parts are separated by '-', so the version cannot contain
      # one; see the top of this file. A tag is also at most 128 characters.
      - name: Every wrapper's tag reads one way
        run: |
          status=0
          for f in */wrapper.json; do
            slug=$(jq -r .tool.slug "$f")
            version=$(jq -r .version "$f")
            if ! printf '%s' "$version" | grep -qE '^[A-Za-z0-9._]+$'; then
              echo "::error file=$f::version \"$version\" may use only letters, digits, '.' and '_': it is part of the image tag <slug>-<version>-<commit>, whose parts are separated by '-'"
              status=1
            fi
            if [ $(( ${#slug} + ${#version} + 14 )) -gt 128 ]; then
              echo "::error file=$f::$slug-$version-<commit> is longer than the 128 characters a tag may be"
              status=1
            fi
          done
          exit $status
      # main builds into wrappers-staging. A generated branch builds its one
      # wrapper into its environment's candidates package, and may change
      # nothing but that wrapper's directory: not the contract, not go.mod,
      # not this workflow, which a branch push runs from its own copy of.
      - id: package
        if: ${{ startsWith(github.ref, 'refs/heads/generated/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          env=$(printf '%s' "$BRANCH" | cut -d/ -f2)
          name=$(printf '%s' "$BRANCH" | cut -d/ -f3-)
          case "$env" in staging|prod) ;; *) echo "::error::$BRANCH names no environment (staging or prod)"; exit 1 ;; esac
          # <slug>-<version>-<id>: neither the version nor Mendel's id holds
          # a '-', so the slug is what is left of the last two.
          slug=$(printf '%s' "$name" | sed -E 's/-[^-]+-[^-]+$//')
          if [ -z "$slug" ] || [ ! -f "$slug/wrapper.json" ]; then
            echo "::error::$BRANCH names no wrapper directory in this commit"
            exit 1
          fi
          git fetch -q origin main
          # --no-renames, or moving contract/ or go.mod into $slug/ would be
          # reported by its new path alone, and pass.
          outside=$(git diff --no-renames --name-only origin/main...HEAD | grep -v "^$slug/" || true)
          if [ -n "$outside" ]; then
            echo "::error::a generated branch changes only its wrapper's directory, $slug/; this one also changes: $outside"
            exit 1
          fi
          echo "package=wrapper-candidates-$env" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      # Only what this push changed is built, so an unchanged wrapper keeps
      # the tags it has. A change to what every wrapper builds from (the
      # contract module, go.mod, this workflow), a manual run, or a push
      # whose parent is unknown builds them all.
      - id: list
        env:
          BEFORE: ${{ github.event.before }}
          GENERATED: ${{ steps.package.outputs.slug }}
        run: |
          all=$(for f in */wrapper.json; do dirname "$f"; done)
          if [ -n "$GENERATED" ]; then
            echo "wrappers=$(printf '%s' "$GENERATED" | jq -R -s -c '[.]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] ||
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
             git diff --no-renames --name-only "$BEFORE" HEAD | grep -qE '^(contract/|go\.mod$|go\.sum$|\.github/workflows/images\.yml$)'; then
            changed="$all"
          else
            changed=$(git diff --no-renames --name-only "$BEFORE" HEAD | cut -d/ -f1 | sort -u | grep -Fxf <(echo "$all") || true)
          fi
          echo "wrappers=$(printf '%s\n' $changed | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # Builds each wrapper's image into a tarball, with nothing that can write a
  # package: the Dockerfile's RUN steps are the wrapper author's code.
  build:
    needs: [test, find]
    if: ${{ needs.find.outputs.wrappers != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        wrapper: ${{ fromJSON(needs.find.outputs.wrappers) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Describe, and make a build context without .git
        run: |
          mkdir -p /tmp/out
          version=$(jq -r .version '${{ matrix.wrapper }}/wrapper.json')
          commit=$(git rev-parse --short=12 HEAD)
          printf '%s' "$version" > /tmp/out/version
          printf '%s' "$commit" > /tmp/out/commit
          printf '%s' "${{ matrix.wrapper }}-$version-$commit" > /tmp/out/tag
          mkdir -p /tmp/context
          git archive HEAD | tar -x -C /tmp/context
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: /tmp/context
          file: /tmp/context/${{ matrix.wrapper }}/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/out/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.wrapper }}
          path: /tmp/out
          retention-days: 1

  # Pushes what build made. The only job that can write a package, and it
  # runs no wrapper's code: it has no checkout, only the tarball and three
  # lines of text.
  push:
    needs: [find, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        wrapper: ${{ fromJSON(needs.find.outputs.wrappers) }}
    env:
      PACKAGE: ${{ needs.find.outputs.package || 'wrappers-staging' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.wrapper }}
          path: /tmp/out
      # What build wrote is read as data and held to the one shape a tag
      # has, <wrapper>-<version>-<commit>, before anything uses it.
      - id: describe
        run: |
          tag=$(cat /tmp/out/tag)
          if ! printf '%s' "$tag" | grep -qxE '${{ matrix.wrapper }}-[A-Za-z0-9._]+-[0-9a-f]{12,40}'; then
            echo "::error::build handed over the tag \"$tag\", which is not <wrapper>-<version>-<commit>"
            exit 1
          fi
          echo "version=$(cat /tmp/out/version)" >> "$GITHUB_OUTPUT"
          echo "commit=$(cat /tmp/out/commit)" >> "$GITHUB_OUTPUT"
          echo "tag=$(cat /tmp/out/tag)" >> "$GITHUB_OUTPUT"
      - uses: imjasonh/setup-crane@v0.7
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      # A tag already published is never pushed again. Re-running this job, or
      # a run whose push landed before a later step failed, would otherwise
      # push a rebuild of the same commit, which is not byte-identical, and
      # move the tag off the digest an installation may already have
      # registered; promote.yml would then refuse that digest. So a tag that
      # exists is reused as it is, and a bad build is replaced by a new
      # commit, never by a re-run.
      - id: published
        env:
          IMAGE: ghcr.io/mendelbuild/${{ env.PACKAGE }}:${{ steps.describe.outputs.tag }}
        run: |
          if out=$(crane digest "$IMAGE" 2>&1); then
            echo "$IMAGE is already published as $out; not pushing it again."
            echo "digest=$out" >> "$GITHUB_OUTPUT"
            exit 0
          # A missing tag is MANIFEST_UNKNOWN; a package not created yet can
          # answer DENIED. Either way it is absent, and a real failure to
          # authenticate fails the push below instead.
          elif ! printf '%s' "$out" | grep -qE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|DENIED|404'; then
            echo "::error::Could not tell whether $IMAGE is published: $out"
            exit 1
          fi
          crane push /tmp/out/image.tar "$IMAGE"
          echo "digest=$(crane digest "$IMAGE")" >> "$GITHUB_OUTPUT"
      - name: Say what to register
        if: ${{ env.PACKAGE == 'wrappers-staging' }}
        run: |
          {
            echo "### ${{ matrix.wrapper }} ${{ steps.describe.outputs.version }} (built at ${{ steps.describe.outputs.commit }})"
            echo
            echo "Published as \`ghcr.io/mendelbuild/wrappers-staging:${{ steps.describe.outputs.tag }}\`. On staging:"
            echo
            echo '```'
            echo "mendel-tool tools register -file ${{ matrix.wrapper }}/wrapper.json \\"
            echo "  -image ghcr.io/mendelbuild/wrappers-staging@${{ steps.published.outputs.digest }}"
            echo '```'
            echo
            echo "Once staging has run it, promote it (Actions, promote, Run workflow) with"
            echo "tag \`${{ steps.describe.outputs.tag }}\` and digest \`${{ steps.published.outputs.digest }}\`,"
            echo "and register the same digest from ghcr.io/mendelbuild/wrappers-prod on production."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Say what Mendel registers
        if: ${{ env.PACKAGE != 'wrappers-staging' }}
        run: |
          {
            echo "### ${{ matrix.wrapper }} ${{ steps.describe.outputs.version }}, written by Mendel (built at ${{ steps.describe.outputs.commit }})"
            echo
            echo "Published as \`ghcr.io/mendelbuild/$PACKAGE:${{ steps.describe.outputs.tag }}\`, digest \`${{ steps.published.outputs.digest }}\`."
            echo "The Mendel that pushed this branch registers it itself, as an unreviewed candidate. Merging it"
            echo "to main is what promotes it."
          } >> "$GITHUB_STEP_SUMMARY"
      # Asked with no credentials, as a project's cluster would ask, and after
      # the summary, so the digest is printed either way. A package this
      # workflow creates takes the repository's visibility, so this passes
      # while the repository is public; it is here so that stops being silent.
      - name: The image can be pulled anonymously
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:mendelbuild/$PACKAGE:pull" | jq -r .token) || true
          if ! curl -fsSI -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/mendelbuild/$PACKAGE/manifests/${{ steps.published.outputs.digest }}" >/dev/null; then
            echo "::error::ghcr.io/mendelbuild/$PACKAGE cannot be pulled anonymously, so no project's cluster could run this wrapper. Make the package public, once: https://github.com/orgs/mendelbuild/packages/container/$PACKAGE/settings (Danger Zone, Change visibility, Public)."
            exit 1
          fi
